
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AkaPurvee2GOMO</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        /* Main container */
        body > * {
            margin-bottom: 25px;
        }

        /* Headings */
        h1, h2, h3, h4, h5 {
            margin: 20px auto;
            font-weight: 800;
            letter-spacing: 2px;
            transition: 0.3s ease;
        }

        h1 {
            color: #7CFFB2;
            font-size: clamp(32px, 6vw, 55px);
            text-shadow: 0 0 15px #7CFFB2;
        }

        h2 {
            color: #ffe66d;
            font-size: 40px;
        }

        h3 {
            color: #ff9f80;
            font-size: 32px;
        }

        h4 {
            color: #74c0fc;
            font-size: 27px;
        }

        h5 {
            color: #da9ff9;
            font-size: 23px;
        }

        h1:hover, h2:hover, h3:hover,
        h4:hover, h5:hover {
            transform: scale(1.05);
        }

        /* Facebook link */
        a {
            display: inline-block;
            margin: 20px;
            padding: 13px 25px;
            background: #1877F2;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        a:hover {
            background: #0d5bc4;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px #1877F288;
        }

        a:focus-visible, button:focus-visible {
            outline: 3px solid white;
            outline-offset: 4px;
        }

        /* Button */
        button {
            display: block;
            margin: 20px auto;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px #ff416c66;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px #ff416c99;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Preformatted text */
        pre {
            display: inline-block;
            margin: 25px auto;
            padding: 25px 50px;
            background: #101827;
            color: #7CFFB2;
            border: 1px solid #7CFFB255;
            border-radius: 15px;
            text-align: left;
            font-size: 18px;
            line-height: 1.8;
            box-shadow: 0 8px 25px #0005;
            overflow-x: auto;
            max-width: 100%;
        }

        /* Selection */
        ::selection {
            background: #7CFFB2;
            color: #141e30;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 25px 12px;
            }

            h2 {
                font-size: 32px;
            }

            h3 {
                font-size: 27px;
            }

            pre {
                padding: 18px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <h1>HelloGayAkaPurve</h1>
    <h2>HelloGayAkaPurve</h2>
    <h3>HelloGayAkaPurve</h3>
    <h4>HelloGayAkaPurve</h4>
    <h5>HelloGayAkaPurve</h5>

    <a href="https://www.facebook.com"
       target="_blank"
       rel="noopener noreferrer">
        Visit Facebook
    </a>

    <button type="button">
        This is Aka's Button
    </button>

    <pre>
gayaka
gaypurvee
    </pre>

</body>
</html>
